name: tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: unit tests (fake upstream, no network)
        run: python tests/run_tests.py
      - name: TUI smoke (needs terminfo/curses)
        if: runner.os != 'Windows'
        run: python tests/tui_smoke.py
