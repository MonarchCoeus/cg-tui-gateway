name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build artifacts
        run: |
          mkdir -p dist work
          git archive --format=tar.gz --prefix=cg-tui-gateway/ -o dist/cg-tui-gateway.tar.gz HEAD
          tar -C work -xzf dist/cg-tui-gateway.tar.gz
          (cd work && zip -qr ../dist/cg-tui-gateway.zip cg-tui-gateway)
          cp scripts/install.sh scripts/install.ps1 dist/
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/cg-tui-gateway.tar.gz dist/cg-tui-gateway.zip \
            dist/install.sh dist/install.ps1 \
            --title "CG $GITHUB_REF_NAME" \
            --notes "Installer one-liners (Linux/macOS):
            \`\`\`bash
            curl -fsSL https://github.com/MonarchCoeus/cg-tui-gateway/releases/latest/download/install.sh | bash
            \`\`\`
            Windows (PowerShell):
            \`\`\`powershell
            irm https://github.com/MonarchCoeus/cg-tui-gateway/releases/latest/download/install.ps1 | iex
            \`\`\`
            Full docs: https://github.com/MonarchCoeus/cg-tui-gateway#readme"
